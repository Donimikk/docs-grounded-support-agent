<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fyndit Support Helper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a5a47'/%3E%3Cpath d='M5 4h6M5 8h6M5 12h3' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* The tokens are deliberately the same as in index.html - the sign-in screen
   should look like the first screen of the same application, not like a
   stranger's detour. */
:root {
  --ground:    #f7f7f5;
  --surface:   #ffffff;
  --ink:       #16181d;
  --ink-soft:  #5c6270;
  --ink-faint: #8b909c;
  --line:      #e3e3df;
  --accent:    #1a5a47;
  --accent-in: #ffffff;
  --danger:    #a3342c;

  --serif: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ground:    #131417;
    --surface:   #191b1f;
    --ink:       #e9e9e5;
    --ink-soft:  #a0a5ad;
    --ink-faint: #767b85;
    --line:      #2a2d33;
    --accent:    #4c9d84;
    --accent-in: #0d1512;
    --danger:    #d98078;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1.5rem;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
}

.gate {
  width: 100%;
  max-width: 26rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2.25rem 2rem;
}

h1 {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -.01em;
  margin: 0 0 .35rem;
}

.lede { margin: 0 0 1.75rem; color: var(--ink-soft); font-size: .92rem; }

label {
  display: block;
  font-size: .78rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: .45rem;
}

input[type="password"] {
  width: 100%;
  padding: .7rem .8rem;
  font: inherit;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 4px;
}
input[type="password"]:focus { border-color: var(--accent); outline: none; }

button {
  width: 100%;
  margin-top: 1rem;
  padding: .7rem 1rem;
  font: inherit;
  font-weight: 600;
  color: var(--accent-in);
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
}
button:hover { filter: brightness(1.08); }

.error {
  margin: 0 0 1.25rem;
  padding: .65rem .8rem;
  font-size: .9rem;
  color: var(--danger);
  border: 1px solid currentColor;
  border-radius: 4px;
}

.hint {
  margin: 1.5rem 0 0;
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
  font-size: .82rem;
  color: var(--ink-faint);
}
</style>
</head>
<body>

<main class="gate">
  <h1>Fyndit Support Helper</h1>
  <p class="lede">Internal tool. Enter the password.</p>

  <!-- ERROR_SLOT -->

  <!-- A plain form, no JavaScript: the server verifies the password and the
       browser never sees it compared. -->
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Enter</button>
  </form>

  <p class="hint">One shared password, no accounts. This browser stays signed
    in until you log out or the password changes.</p>
</main>

</body>
</html>
